<div class="start-container" *ngIf="content$ | async as content">
  <h2>{{ content.heading }}</h2>
  <p>{{ content.paragraph }}</p>
  <button 
    *ngFor="let button of content.buttons" 
    id="start-button" 
    (click)="navigateToMain()" 
    class="btn-primary">
    {{ button.title }}
  </button>
</div>
